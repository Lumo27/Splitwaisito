      <text x="72" y="54" fill="#64748B" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="400">Pagó Lucas · 4 personas</text>
      <text x="328" y="36" fill="#059669" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="end">$ 28.000</text>
