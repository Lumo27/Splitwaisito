    <text x="16" y="52" fill="#EF4444" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">Vos le debés a Franco</text>
    <text x="326" y="48" fill="#EF4444" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="end">$ 4.250,00</text>

    <!-- Línea Divisoria -->
    <line x1="16" y1="68" x2="326" y2="68" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Fila Inferior con Alias y Botón Saldar -->
    <text x="16" y="98" fill="#0F172A" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600">Alias: <tspan fill="#64748B" font-weight="400">franco.mp</tspan></text>
