    <text x="171" y="18" fill="#0F172A" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Viaje a Bariloche</text>
    <text x="171" y="34" fill="#64748B" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">4 integrantes · ARS</text>
