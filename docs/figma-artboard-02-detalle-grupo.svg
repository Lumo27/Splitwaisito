      <text x="328" y="36" fill="#0F172A" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="end">$ 18.400</text>
      <text x="328" y="54" fill="#64748B" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="end">Tu parte: $ 4.600</text>
